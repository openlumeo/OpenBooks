<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Books: Concept B, The Monolith</title>
<meta name="description" content="Hero concept B: a monument to a number that ties out.">
<script>
  /* Theme before first paint. Dark is the default; light only when stored. */
  (function () {
    try {
      if (localStorage.getItem('b-theme') === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap">
<link rel="stylesheet" href="vendor/theme-tokens.css">
<link rel="stylesheet" href="vendor/type-scale.css">
<link rel="stylesheet" href="b-concept.css">
</head>
<body>

<header class="nav">
  <a class="lockup" href="#top" aria-label="Open Books by Lumeo, home">
    <b>Open Books</b>
    <small>by Lumeo</small>
  </a>
  <nav class="nav-links" aria-label="Primary">
    <a class="nav-link" href="/docs">Docs</a>
    <a class="btn btn-primary btn-sm" href="/app">Open workspace</a>
    <button class="theme-toggle" type="button" aria-label="Switch to light theme" aria-pressed="false">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
        <circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.2"></circle>
        <path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor"></path>
      </svg>
    </button>
  </nav>
</header>

<main>
  <section class="hero" id="top">
    <div class="atmos" aria-hidden="true"></div>
    <div class="bloom" aria-hidden="true"></div>
    <div class="horizon" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <div class="lead">
      <div class="lead-in">
        <h1 class="display">Every figure proven,<br>or refused with a reason.</h1>
        <p class="lede">Open Books checks each document's own arithmetic. Ties out: structured data, with the source of every figure. Does not: the reason, never a guess.</p>
        <div class="ctas">
          <a class="btn btn-primary" href="/app">Open workspace</a>
          <a class="btn btn-secondary" href="/docs">Read the docs</a>
        </div>
      </div>
    </div>

    <div class="stage">
      <div class="rise">
        <div class="plane-back" aria-hidden="true"></div>

        <figure class="plane-front" role="img" aria-label="Released statement, INR. Opening 1000.00. Five transactions shown, then closing 5100.40. Equation: 1000.00 + 6857.26 minus 2756.86 equals 5100.40.">
          <div class="instrument">
            <div class="rail" aria-hidden="true"></div>
            <div class="stamp" aria-hidden="true"><span class="stamp-in">Released</span></div>

            <div class="ledger-head" aria-hidden="true">
              <span>statement.csv</span>
              <span>INR</span>
            </div>

            <div class="ledger" aria-hidden="true">
              <div class="lrow lrow-head">
                <span>Date</span><span>Description</span><span>Dir</span><span class="r">Amount</span><span class="r">Balance</span>
              </div>
              <div class="lrow sum">
                <span class="lab">Opening</span><span class="amt">1000.00</span>
              </div>
              <div class="lrow"><span class="tie"></span><span class="dt">2026-01-01</span><span>TXN 0</span><span class="dir">CR</span><span class="r">1698.81</span><span class="r">2698.81</span></div>
              <div class="lrow"><span class="tie"></span><span class="dt">2026-01-02</span><span>TXN 1</span><span class="dir">DR</span><span class="r">2071.01</span><span class="r">627.80</span></div>
              <div class="lrow"><span class="tie"></span><span class="dt">2026-01-03</span><span>TXN 2</span><span class="dir">DR</span><span class="r">380.77</span><span class="r">247.03</span></div>
              <div class="lrow"><span class="tie"></span><span class="dt">2026-01-04</span><span>TXN 3</span><span class="dir">CR</span><span class="r">494.51</span><span class="r">741.54</span></div>
              <div class="lrow"><span class="tie"></span><span class="dt">2026-01-05</span><span>TXN 4</span><span class="dir">DR</span><span class="r">305.08</span><span class="r">436.46</span></div>
              <div class="lrow gap"><span>&hellip;</span></div>
              <div class="lrow sum close">
                <span class="lab">Closing</span><span class="amt">5100.40</span>
              </div>
            </div>

            <div class="eq" aria-hidden="true">
              <span>Equation</span>
              <span>1000.00 + 6857.26 &minus; 2756.86 = 5100.40</span>
            </div>
          </div>
        </figure>
      </div>
    </div>
  </section>

  <section class="next" aria-hidden="true"></section>
</main>

<script src="vendor/js/gsap.min.js"></script>
<script src="vendor/js/ScrollTrigger.min.js"></script>
<script src="b-concept.js"></script>
</body>
</html>
