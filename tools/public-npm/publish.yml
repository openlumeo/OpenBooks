name: publish

# Publishes @lumeo_hq/openbooks from a matching version tag with npm provenance.
# Authentication is npm trusted publishing (OIDC): there is no token in this repository or its secrets.
# Configure the package's trusted publisher on npmjs.com under Settings > Trusted Publisher > GitHub Actions:
# repository Sagexd08/openbooks-js, workflow filename publish.yml.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # lets npm verify this workflow run and sign the provenance statement
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Trusted publishing needs npm 11.5.1 or newer
        run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
        env:
          OPENBOOKS_SKIP_PYTHON: "1"
      - name: The tag matches the package version
        run: |
          version=$(node -p "require('./cli/package.json').version")
          test "${GITHUB_REF_NAME}" = "v${version}"
      - run: pnpm --filter @lumeo_hq/openbooks build
      - name: Pack
        run: |
          mkdir tarballs
          pnpm --filter @lumeo_hq/openbooks pack --pack-destination "$GITHUB_WORKSPACE/tarballs"
      - name: Publish with provenance
        run: |
          version=$(node -p "require('./cli/package.json').version")
          npm publish "tarballs/lumeo_hq-openbooks-${version}.tgz" --access public --provenance
