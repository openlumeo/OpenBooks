[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "openbooks-tax"
dynamic = ["version"]
description = "Open Books providers for tax and ledger documents: Form 26AS, AIS, FIRA, Form 1099-B, trial balance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openbooks-core[xlsx]>=0.1.0,<0.2"]

[project.entry-points."openbooks.layouts"]
"form_1099b.v1" = "openbooks_tax.parsers:parse_1099b"
"tds_26as.v1" = "openbooks_tax.parsers:parse_tds"
"ais.v1" = "openbooks_tax.parsers:parse_ais"
"fira.v1" = "openbooks_tax.parsers:parse_fira"
"trial_balance.v1" = "openbooks_tax.parsers:parse_trial_balance"

[project.entry-points."openbooks.gates"]
tax_statement = "openbooks_tax.gates:tax_statement"
ais = "openbooks_tax.gates:ais"
form_1099b = "openbooks_tax.gates:form_1099b"
fira = "openbooks_tax.gates:fira"
trial_balance = "openbooks_tax.gates:trial_balance"

[tool.hatch.version]
path = "src/openbooks_tax/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/openbooks_tax"]

[tool.hatch.build.targets.sdist]
include = ["src/openbooks_tax", "README.md", "pyproject.toml"]
