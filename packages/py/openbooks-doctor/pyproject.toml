[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "openbooks-doctor"
dynamic = ["version"]
description = "Open Books doctor: checks an installation, its providers and model assets, and runs a built-in proven-or-refused self-test"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openbooks-core>=0.1.0,<0.2"]

[project.scripts]
openbooks-doctor = "openbooks_doctor.cli:main"

[project.entry-points."openbooks.commands"]
doctor = "openbooks_doctor.cli:COMMAND"

[tool.hatch.version]
path = "src/openbooks_doctor/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/openbooks_doctor"]

[tool.hatch.build.targets.sdist]
include = ["src/openbooks_doctor", "README.md", "pyproject.toml"]
