[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "openbooks"
dynamic = ["version"]
description = "Open Books: financial documents in, one proven JSON per file out (or a typed refusal). Bank statements, payment gateways, tax documents."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
# One distribution: openbooks.core, openbooks.statements, openbooks.gateways, openbooks.tax and openbooks.doctor. The base install
# reads every layout, PDFs with a text layer included. Scans and the typed heads need PyTorch, so they stay an extra.
dependencies = ["jsonschema>=4.18", "openpyxl", "pypdfium2>=4.30"]

[project.optional-dependencies]
scan = ["easyocr", "torch>=2.6", "pillow", "numpy"]  # OCR for scans and photos, and the typed heads (--model)

[project.urls]
Homepage = "https://github.com/Sagexd08/OpenBooks"
Documentation = "https://books.openlumeo.com/docs"

[project.scripts]
openbooks = "openbooks.core.cli:main"
openbooks-doctor = "openbooks.doctor.cli:main"

# The built-in providers register through the same entry points a third-party plugin would use, so the registry treats them alike.
[project.entry-points."openbooks.layouts"]
"bank_csv.v1" = "openbooks.statements.parsers:parse_bank_csv"
"bank_csv_signed.v1" = "openbooks.statements.parsers:parse_bank_csv_signed"
"stripe_balance.v1" = "openbooks.gateways.parsers:parse_stripe"
"razorpay_settlement.v1" = "openbooks.gateways.parsers:parse_razorpay"
"paypal_activity.v1" = "openbooks.gateways.parsers:parse_paypal"
"wise_statement.v1" = "openbooks.gateways.parsers:parse_wise"
"form_1099b.v1" = "openbooks.tax.parsers:parse_1099b"
"tds_26as.v1" = "openbooks.tax.parsers:parse_tds"
"ais.v1" = "openbooks.tax.parsers:parse_ais"
"fira.v1" = "openbooks.tax.parsers:parse_fira"
"trial_balance.v1" = "openbooks.tax.parsers:parse_trial_balance"

[project.entry-points."openbooks.sniffers"]
"ofx.v1" = "openbooks.statements.parsers:parse_ofx"
"mt940.v1" = "openbooks.statements.parsers:parse_mt940"
"camt053.v1" = "openbooks.statements.parsers:parse_camt053"

[project.entry-points."openbooks.frontends"]
document = "openbooks.statements.frontend:FRONTEND"

[project.entry-points."openbooks.gates"]
"statement:ocr_dates" = "openbooks.statements.gates:ocr_dates"
tax_statement = "openbooks.tax.gates:tax_statement"
ais = "openbooks.tax.gates:ais"
form_1099b = "openbooks.tax.gates:form_1099b"
fira = "openbooks.tax.gates:fira"
trial_balance = "openbooks.tax.gates:trial_balance"

[project.entry-points."openbooks.commands"]
doctor = "openbooks.doctor.cli:COMMAND"

[tool.hatch.version]
path = "src/openbooks/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/openbooks"]

# The weights and their calibration travel together in one wheel so the hash binding can never see a mismatched pair.
# Source of truth stays models/ at the repo root. Only the weights, their calibration and the model card ship (hatch_build.py),
# in the wheel and in the sdist, so a wheel built from the sdist is the same.
[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist.hooks.custom]

[tool.hatch.build.targets.sdist]
include = ["LICENSE", "src/openbooks", "README.md", "pyproject.toml", "hatch_build.py"]
