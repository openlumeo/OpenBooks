# PRIVATE. Lumeo training, synthetic data, golden-set builders and payout matching. Never publish this distribution:
# the classifier below makes PyPI refuse the upload, and CI checks that no public wheel imports it.
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lumeo-openbooks-lab"
version = "0.1.0"
description = "Private: Open Books training recipe, synthetic data generator, golden-set builders, payout matching"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Lumeo-Proprietary"
classifiers = ["Private :: Do Not Upload"]
dependencies = ["openbooks-core", "openbooks-statements[scan]", "openpyxl", "numpy", "scipy"]

[project.entry-points."openbooks.linkers"]
default = "openbooks_lab.link"

[tool.hatch.build.targets.wheel]
packages = ["src/openbooks_lab"]
