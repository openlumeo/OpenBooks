[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openbooks-core"
version = "0.1.0"
description = "Shared contracts and deterministic primitives for Open Books"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jsonschema"]

[tool.setuptools]
packages = ["openbooks_core"]
package-dir = {"" = "src"}
