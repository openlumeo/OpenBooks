[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "openbooks-core"
version = "0.1.0"
description = "Open Books core: the openbooks.v1 contract, Decimal normalisation, balance gates and the layout registry"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.18"]

[project.scripts]
openbooks = "openbooks_core.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openbooks_core"]

[tool.hatch.build.targets.sdist]
include = ["src/openbooks_core", "README.md", "pyproject.toml"]
