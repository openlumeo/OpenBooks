services:
  engine:
    build:
      context: .
      dockerfile: deploy/engine.Dockerfile
    restart: unless-stopped
    environment:
      OMP_NUM_THREADS: ${OPENBOOKS_CPU_THREADS:-2}
      MKL_NUM_THREADS: ${OPENBOOKS_CPU_THREADS:-2}
    healthcheck:
      test: ["CMD", "python", "/app/ready.py"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [backend]

  web:
    build: ./web
    restart: unless-stopped
    environment:
      OPENBOOKS_ENGINE_URL: http://engine:8765
      OPENBOOKS_LLM_API_KEY: ${OPENBOOKS_LLM_API_KEY:-}
      OPENBOOKS_LLM_MODEL: ${OPENBOOKS_LLM_MODEL:-}
      OPENBOOKS_LLM_BASE_URL: ${OPENBOOKS_LLM_BASE_URL:-https://openrouter.ai/api/v1}
    depends_on:
      engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/engine/health').then(r => r.json()).then(h => { if (!h.model_ready || !h.ocr_available) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks: [edge, backend]

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      OPENBOOKS_SITE_ADDRESS: ${OPENBOOKS_SITE_ADDRESS:?Set the public website hostname}
    ports:
      - "${OPENBOOKS_HTTP_BIND:-80}:80"
      - "${OPENBOOKS_HTTPS_BIND:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - proxy-data:/data
      - proxy-config:/config
    depends_on:
      web:
        condition: service_healthy
    networks: [edge]

networks:
  edge:
  backend:
    internal: true

volumes:
  proxy-data:
  proxy-config:
