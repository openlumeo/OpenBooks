[project]
name = "openbooks"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["jsonschema", "openpyxl", "pymupdf", "numpy", "scipy"]

[project.optional-dependencies]
scan = ["easyocr", "torch", "pillow"]  # OCR for scans and the typed heads (--model)

[project.scripts]
openbooks = "openbooks.pipeline:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
