[build]
  base = "web"
  command = "python ../deploy/build-public-assets.py && pnpm run build"
  publish = ".next"
  ignore = 'test -n "$CACHED_COMMIT_REF" && test "$CACHED_COMMIT_REF" != "$COMMIT_REF" && git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- . ../harness ../packages/py/openbooks ../scripts/harness ../deploy/build-public-assets.py ../netlify.toml'

[build.environment]
  PYTHON_VERSION = "3.13"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "https://openbooks.openlumeo.com/*"
  to = "https://books.openlumeo.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://openbooks.openlumeo.com/*"
  to = "https://books.openlumeo.com/:splat"
  status = 301
  force = true
