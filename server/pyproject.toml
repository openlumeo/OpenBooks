[project]
name = "openbooks-server"
version = "0.1.0"
description = "HTTP service for the Open Books engine: one openbooks.v1 JSON per file, streamed as server-sent events."
requires-python = ">=3.11"
dependencies = ["openbooks~=0.2.0", "anyio>=4", "fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.20"]

[project.optional-dependencies]
test = ["pytest", "httpx"]
scan = ["openbooks[scan]"]
retention = ["boto3", "psycopg[binary]"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["openbooks_server*"]

[tool.setuptools.package-data]
openbooks_server = ["samples.zip"]

[tool.pytest.ini_options]
testpaths = ["tests"]
