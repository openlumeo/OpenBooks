name: publish-pypi-mcp

# Publishes `openbooks-mcp` to PyPI with Trusted Publishing (OIDC), on tags like mcp-v0.1.0.
# One-time setup on PyPI (project openbooks-mcp): add this repo, workflow file publish-pypi-mcp.yml and the GitHub
# environment `pypi-openbooks-mcp` as a trusted publisher. A PyPI version can never be re-uploaded, only yanked.

on:
  push:
    tags: ["mcp-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - name: The tag matches the package version, when there is a tag
        run: python scripts/check_versions.py "${GITHUB_REF_NAME}"
        if: github.ref_type == 'tag'
      - run: python -m build --sdist --wheel --outdir dist packages/py/openbooks-mcp
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-dists
          path: dist/

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: { name: pypi-openbooks-mcp, url: "https://pypi.org/project/openbooks-mcp/" }
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: python-dists, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: dist/ }
