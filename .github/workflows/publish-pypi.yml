name: publish-pypi

# Publishes the `openbooks` Python package to PyPI with Trusted Publishing (OIDC): no tokens in the repo or in secrets.
# The PyPI project `openbooks` lists Sagexd08/OpenBooks, this workflow file (publish-pypi.yml) and the GitHub environment
# `pypi-openbooks` as its trusted publisher. A PyPI version can never be re-uploaded, only yanked.
# Until 0.1.0 the engine was split across six distributions (openbooks-core, -statements, -gateways, -tax, -doctor and the
# openbooks meta package); since 0.2.0 everything ships in `openbooks` and the five others are no longer released.

on:
  push:
    tags: ["py-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - name: The tag matches the package version, when there is a tag
        run: python scripts/check_versions.py "${GITHUB_REF_NAME}"
        if: github.ref_type == 'tag'
      - run: python -m build --sdist --wheel --outdir dist packages/py/openbooks
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-dists
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: pypi-openbooks, url: "https://pypi.org/project/openbooks/" }
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: python-dists, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: dist/ }
